<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Freq Sound Meter</title>
    <style>
        :root { --bg-color: #121212; --text-color: #e0e0e0; --accent-color: #00e676; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;
            transition: transform 0.5s ease;
        }
        /* 180度回転用クラス */
        .rotated { transform: rotate(180deg); }

        .container { text-align: center; width: 90%; }
        .value-display { font-size: 3.5rem; font-weight: bold; margin: 10px 0; color: var(--accent-color); }
        .label { font-size: 1rem; color: #888; }
        .peak-display { font-size: 1.5rem; color: #ff5252; margin-bottom: 30px; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button {
            padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold;
            cursor: pointer; background: #333; color: white;
        }
        button.active { background: var(--accent-color); color: #000; }
        button.stop { background: #ff5252; }
        .rotate-btn { grid-column: span 2; background: #444; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="label">Target Frequency</div>
    <div id="freqLabel" style="font-size: 1.5rem; font-weight: bold;">-- kHz</div>

    <div class="label" style="margin-top: 20px;">Real-time SPL (Relative dB)</div>
    <div id="realtimeValue" class="value-display">-80.0</div>

    <div class="label">Peak Value</div>
    <div id="peakValue" class="peak-display">-80.0</div>

    <div class="controls">
        <button id="freq19" onclick="setFrequency(19000)">19kHz</button>
        <button id="freq21" onclick="setFrequency(21000)">21kHz</button>
        <button id="startBtn" onclick="toggleStart()" style="background: #2979ff;">Start</button>
        <button onclick="resetPeak()">Reset Peak</button>
        <button class="rotate-btn" onclick="toggleRotation()">画面を180度回転</button>
    </div>
</div>

<script>
    let audioCtx, analyser, dataArray, animationId, mediaStream;
    let isRunning = false;
    let targetFreq = 19000;
    let peakDb = -Infinity;

    const realtimeEl = document.getElementById('realtimeValue');
    const peakEl = document.getElementById('peakValue');
    const freqLabelEl = document.getElementById('freqLabel');

    function setFrequency(f) {
        targetFreq = f;
        freqLabelEl.innerText = (f / 1000) + " kHz";
        document.getElementById('freq19').classList.toggle('active', f === 19000);
        document.getElementById('freq21').classList.toggle('active', f === 21000);
        resetPeak();
    }

    function toggleRotation() {
        document.body.classList.toggle('rotated');
    }

    function resetPeak() {
        peakDb = -Infinity;
        peakEl.innerText = "-80.0";
    }

    async function toggleStart() {
        if (isRunning) {
            stopAnalysis();
            return;
        }
        
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false // 測定精度のため補正機能をオフ
            }});
            
            const source = audioCtx.createMediaStreamSource(mediaStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096; // 高周波の分解能を上げるため大きめに設定
            source.connect(analyser);

            dataArray = new Float32Array(analyser.frequencyBinCount);
            isRunning = true;
            document.getElementById('startBtn').innerText = "Stop";
            document.getElementById('startBtn').classList.add('stop');
            
            setFrequency(targetFreq);
            analyze();
        } catch (err) {
            stopAnalysis(); // 途中まで確保したリソースを解放
            alert("マイクの起動に失敗しました: " + err);
        }
    }

    function stopAnalysis() {
        isRunning = false;
        cancelAnimationFrame(animationId);
        // マイクのトラックを停止しないと、ブラウザ上でマイク使用中のままになる
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (audioCtx) {
            audioCtx.close();
            audioCtx = null;
        }
        document.getElementById('startBtn').innerText = "Start";
        document.getElementById('startBtn').classList.remove('stop');
    }

    function analyze() {
        if (!isRunning) return;

        analyser.getFloatFrequencyData(dataArray);

        // 特定周波数のインデックス計算
        const nyquist = audioCtx.sampleRate / 2;
        const binIndex = Math.round((targetFreq / nyquist) * (analyser.fftSize / 2));
        
        // 周辺のビンも含めて最大値を取得（わずかな周波数のズレを許容）
        let currentDb = -Infinity;
        for(let i = binIndex - 1; i <= binIndex + 1; i++) {
            if (dataArray[i] > currentDb) currentDb = dataArray[i];
        }

        // 表示の更新
        realtimeEl.innerText = currentDb.toFixed(1);
        if (currentDb > peakDb) {
            peakDb = currentDb;
            peakEl.innerText = peakDb.toFixed(1);
        }

        animationId = requestAnimationFrame(analyze);
    }
</script>
</body>
</html>
